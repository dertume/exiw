<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TON Sticker NFT Market — Glass Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background: #0b0b0f;
        min-height: 100vh;
        color: #f5f5f5;
      }

      .glassy {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(24px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      }

      .glassy-strong {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(28px);
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
      }

      .sheen {
        position: relative;
        overflow: hidden;
      }

      .sheen::after {
        content: "";
        position: absolute;
        inset: -50% -30% auto -30%;
        height: 200%;
        background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        transform: rotate(12deg);
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .sheen:hover::after {
        opacity: 1;
      }

      .blur-orb {
        position: absolute;
        width: 420px;
        height: 420px;
        filter: blur(90px);
        opacity: 0.25;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
        animation: float 12s ease-in-out infinite;
      }

      .blur-orb.orb-2 {
        width: 300px;
        height: 300px;
        animation-delay: -4s;
      }

      .blur-orb.orb-3 {
        width: 260px;
        height: 260px;
        animation-delay: -7s;
      }

      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.12;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
        mix-blend-mode: screen;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) translateX(0px);
        }
        50% {
          transform: translateY(-40px) translateX(20px);
        }
      }

      .chip {
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.08);
      }

      .ton-button {
        background: linear-gradient(135deg, #ffffff, #bfbfbf);
        color: #0d0d0d;
      }

      input,
      textarea,
      select {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #f2f2f2;
      }

      .fade-up {
        animation: fadeUp 0.5s ease-out;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .ringed {
        border-radius: 28px;
        position: relative;
      }

      .ringed::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 28px;
        padding: 1px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  </head>
  <body class="px-4 pb-16">
    <div class="grain"></div>
    <div class="blur-orb" style="top: -120px; left: -80px"></div>
    <div class="blur-orb orb-2" style="top: 120px; right: -60px"></div>
    <div class="blur-orb orb-3" style="bottom: -60px; left: 20%"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useMemo, useState, useEffect } = React;

      const mockStickers = [
        {
          id: 1,
          title: "Phantom Mood",
          artist: "NeoMono",
          price: 2.4,
          supply: "1/50",
          rarity: "Legendary",
          mood: "Dark",
          image: "https://images.unsplash.com/photo-1511765224389-37f0e77cf0eb?auto=format&fit=crop&w=900&q=80",
          description: "Стикер с дымчатой текстурой и мягким свечением.",
        },
        {
          id: 2,
          title: "Void Smile",
          artist: "Luma",
          price: 1.1,
          supply: "1/120",
          rarity: "Rare",
          mood: "Minimal",
          image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80",
          description: "Минималистичный смайлик с объемной тенью.",
        },
        {
          id: 3,
          title: "Echo Wave",
          artist: "Greyland",
          price: 3.75,
          supply: "1/30",
          rarity: "Ultra",
          mood: "Pulse",
          image: "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=80",
          description: "Эхо-эффект с глянцевым градиентом.",
        },
        {
          id: 4,
          title: "Glass Drift",
          artist: "Sora",
          price: 0.9,
          supply: "1/200",
          rarity: "Common",
          mood: "Soft",
          image: "https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=900&q=80",
          description: "Прозрачная капля стекла на темном фоне.",
        },
        {
          id: 5,
          title: "Monochrome Pulse",
          artist: "WhiteNoise",
          price: 2.9,
          supply: "1/45",
          rarity: "Legendary",
          mood: "Pulse",
          image: "https://images.unsplash.com/photo-1487412912498-0447578fcca8?auto=format&fit=crop&w=900&q=80",
          description: "Ритмичный пульс с легким свечением.",
        },
        {
          id: 6,
          title: "Night Loop",
          artist: "Noir",
          price: 1.6,
          supply: "1/80",
          rarity: "Rare",
          mood: "Dark",
          image: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80",
          description: "Циклическое свечение с холодным светом.",
        },
        {
          id: 7,
          title: "Signal Bloom",
          artist: "Flux",
          price: 2.15,
          supply: "1/70",
          rarity: "Ultra",
          mood: "Soft",
          image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80",
          description: "Пульсирующий туман в стеклянной капсуле.",
        },
        {
          id: 8,
          title: "Silent Prism",
          artist: "Mono",
          price: 1.25,
          supply: "1/160",
          rarity: "Common",
          mood: "Minimal",
          image: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80",
          description: "Геометрический минимализм и чистая поверхность.",
        },
      ];

      const tabs = [
        { id: "market", label: "Маркет" },
        { id: "cart", label: "Корзина" },
        { id: "profile", label: "Профиль" },
        { id: "list", label: "Листинг" },
      ];

      const rarityStyles = {
        Common: "text-gray-300",
        Rare: "text-white",
        Ultra: "text-white",
        Legendary: "text-white",
      };

      const moodOptions = ["Все", "Dark", "Minimal", "Pulse", "Soft"];

      const formatTon = (value) => `${value.toFixed(2)} TON`;

      function App() {
        const [activeTab, setActiveTab] = useState("market");
        const [selectedSticker, setSelectedSticker] = useState(null);
        const [stickers, setStickers] = useState(mockStickers);
        const [cart, setCart] = useState([]);
        const [owned, setOwned] = useState([mockStickers[1], mockStickers[3]]);
        const [wallet, setWallet] = useState(null);
        const [query, setQuery] = useState("");
        const [moodFilter, setMoodFilter] = useState("Все");
        const [sort, setSort] = useState("popular");

        useEffect(() => {
          if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }
        }, []);

        useEffect(() => {
          if (!window.TonConnectUI) return;
          const tonConnectUI = new window.TonConnectUI({
            manifestUrl: "https://ton-connect.github.io/demo-dapp/tonconnect-manifest.json",
            buttonRootId: "ton-connect-button",
          });

          tonConnectUI.onStatusChange((walletInfo) => {
            setWallet(walletInfo);
          });

          return () => tonConnectUI?.disconnect?.();
        }, []);

        const filtered = useMemo(() => {
          let items = [...stickers];
          if (query.trim()) {
            const lowered = query.toLowerCase();
            items = items.filter((item) =>
              [item.title, item.artist, item.rarity].some((field) => field.toLowerCase().includes(lowered))
            );
          }
          if (moodFilter !== "Все") {
            items = items.filter((item) => item.mood === moodFilter);
          }
          if (sort === "price") {
            items.sort((a, b) => a.price - b.price);
          }
          if (sort === "latest") {
            items.sort((a, b) => b.id - a.id);
          }
          return items;
        }, [stickers, query, moodFilter, sort]);

        const total = useMemo(
          () => cart.reduce((sum, item) => sum + item.price, 0),
          [cart]
        );

        const addToCart = (item) => {
          setCart((prev) => (prev.find((entry) => entry.id === item.id) ? prev : [...prev, item]));
        };

        const removeFromCart = (id) => {
          setCart((prev) => prev.filter((item) => item.id !== id));
        };

        const checkout = () => {
          if (cart.length === 0) return;
          setOwned((prev) => [...prev, ...cart]);
          setCart([]);
          alert("Покупка выполнена! NFT добавлены в профиль.");
        };

        const listSticker = (event) => {
          event.preventDefault();
          const formData = new FormData(event.target);
          const newSticker = {
            id: stickers.length + 1,
            title: formData.get("title"),
            artist: formData.get("artist"),
            price: Number(formData.get("price")),
            supply: formData.get("supply"),
            rarity: formData.get("rarity"),
            mood: formData.get("mood"),
            image: formData.get("image"),
            description: formData.get("description"),
          };
          setStickers((prev) => [newSticker, ...prev]);
          event.target.reset();
          setActiveTab("market");
        };

        return (
          <div className="max-w-6xl mx-auto">
            <header className="flex flex-col gap-8 py-10">
              <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-8">
                <div className="space-y-4">
                  <p className="uppercase tracking-[0.4em] text-xs text-gray-400">TON NFT GLASS LAB</p>
                  <h1 className="text-4xl md:text-6xl font-semibold">Sticker Marketplace</h1>
                  <p className="text-gray-300 max-w-2xl">
                    Эксклюзивные NFT-стикеры в монохромном стеклянном интерфейсе. Покупайте, коллекционируйте и листьте
                    свои работы за TON прямо в Telegram Mini App.
                  </p>
                  <div className="flex flex-wrap gap-3">
                    <div className="glassy ringed px-4 py-3 text-sm flex items-center gap-2">
                      <span className="text-gray-400">Сделок сегодня</span>
                      <span className="text-white font-semibold">428</span>
                    </div>
                    <div className="glassy ringed px-4 py-3 text-sm flex items-center gap-2">
                      <span className="text-gray-400">Объем</span>
                      <span className="text-white font-semibold">1 248 TON</span>
                    </div>
                    <div className="glassy ringed px-4 py-3 text-sm flex items-center gap-2">
                      <span className="text-gray-400">Холдеров</span>
                      <span className="text-white font-semibold">2 931</span>
                    </div>
                  </div>
                </div>
                <div className="glassy-strong ringed p-6 w-full lg:w-[340px] space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-gray-300">Статус кошелька</span>
                    <span className="text-lg font-semibold">{wallet ? "Подключено" : "—"}</span>
                  </div>
                  <div className="flex items-center justify-between text-sm text-gray-400">
                    <span>TON Connect</span>
                    <span>{wallet ? wallet.account?.address?.slice(0, 8) + "…" : "Не подключен"}</span>
                  </div>
                  <div id="ton-connect-button" className="flex justify-center"></div>
                  {!window.TonConnectUI && (
                    <button className="ton-button py-2 rounded-xl" onClick={() => setWallet({ demo: true })}>
                      Подключить DEMO кошелек
                    </button>
                  )}
                  <div className="text-xs text-gray-400">Оплата в TON, мгновенный листинг и защищенный escrow.</div>
                </div>
              </div>

              <div className="glassy ringed p-5 flex flex-col lg:flex-row lg:items-center gap-4">
                <div className="flex-1">
                  <input
                    className="w-full px-4 py-3 rounded-2xl"
                    placeholder="Поиск по названию, артисту, редкости"
                    value={query}
                    onChange={(event) => setQuery(event.target.value)}
                  />
                </div>
                <div className="flex flex-wrap gap-2">
                  {moodOptions.map((mood) => (
                    <button
                      key={mood}
                      className={`chip px-4 py-2 rounded-full text-xs transition ${
                        moodFilter === mood ? "bg-white text-black" : "text-gray-200"
                      }`}
                      onClick={() => setMoodFilter(mood)}
                    >
                      {mood}
                    </button>
                  ))}
                </div>
                <select
                  className="px-4 py-3 rounded-2xl text-sm"
                  value={sort}
                  onChange={(event) => setSort(event.target.value)}
                >
                  <option value="popular">Популярное</option>
                  <option value="latest">Новинки</option>
                  <option value="price">Цена по возрастанию</option>
                </select>
              </div>
            </header>

            <nav className="flex flex-wrap gap-3 mb-8">
              {tabs.map((tab) => (
                <button
                  key={tab.id}
                  className={`chip px-4 py-2 rounded-full text-sm transition ${
                    activeTab === tab.id ? "bg-white text-black" : "text-gray-200"
                  }`}
                  onClick={() => {
                    setActiveTab(tab.id);
                    setSelectedSticker(null);
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </nav>

            {activeTab === "market" && (
              <section className="fade-up space-y-8">
                {selectedSticker ? (
                  <div className="grid lg:grid-cols-2 gap-8">
                    <div className="glassy ringed overflow-hidden sheen">
                      <img src={selectedSticker.image} alt={selectedSticker.title} className="w-full h-full object-cover" />
                    </div>
                    <div className="glassy ringed p-7 space-y-5">
                      <div>
                        <p className="text-gray-400">
                          {selectedSticker.rarity} · {selectedSticker.supply} · {selectedSticker.mood}
                        </p>
                        <h2 className="text-3xl font-semibold mt-2">{selectedSticker.title}</h2>
                        <p className="text-gray-400 mt-2">Автор: {selectedSticker.artist}</p>
                      </div>
                      <p className="text-gray-200">{selectedSticker.description}</p>
                      <div className="grid sm:grid-cols-2 gap-3">
                        <div className="glassy ringed p-4">
                          <p className="text-xs text-gray-400">Текущая цена</p>
                          <p className="text-2xl font-semibold">{formatTon(selectedSticker.price)}</p>
                        </div>
                        <div className="glassy ringed p-4">
                          <p className="text-xs text-gray-400">Сеть</p>
                          <p className="text-xl font-semibold">TON</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                        <button
                          className="ton-button px-5 py-2 rounded-xl font-medium"
                          onClick={() => addToCart(selectedSticker)}
                        >
                          В корзину
                        </button>
                        <button className="chip px-5 py-2 rounded-xl text-sm" onClick={() => setSelectedSticker(null)}>
                          Вернуться
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filtered.map((sticker) => (
                      <article
                        key={sticker.id}
                        className="glassy ringed overflow-hidden sheen hover:scale-[1.02] transition"
                      >
                        <div className="h-52 overflow-hidden">
                          <img src={sticker.image} alt={sticker.title} className="w-full h-full object-cover" />
                        </div>
                        <div className="p-5 space-y-3">
                          <div className="flex items-center justify-between text-xs text-gray-400">
                            <span className={rarityStyles[sticker.rarity]}>{sticker.rarity}</span>
                            <span>{sticker.supply}</span>
                          </div>
                          <h3 className="text-xl font-semibold">{sticker.title}</h3>
                          <p className="text-gray-400 text-sm">{sticker.artist}</p>
                          <div className="flex items-center justify-between">
                            <span className="font-semibold">{formatTon(sticker.price)}</span>
                            <span className="chip px-3 py-1 rounded-full text-xs">{sticker.mood}</span>
                          </div>
                          <div className="flex gap-2">
                            <button
                              className="chip px-3 py-2 rounded-xl text-xs"
                              onClick={() => setSelectedSticker(sticker)}
                            >
                              Детали
                            </button>
                            <button
                              className="ton-button flex-1 py-2 rounded-xl text-sm font-medium"
                              onClick={() => addToCart(sticker)}
                            >
                              Купить
                            </button>
                          </div>
                        </div>
                      </article>
                    ))}
                  </div>
                )}
              </section>
            )}

            {activeTab === "cart" && (
              <section className="fade-up grid lg:grid-cols-[2fr_1fr] gap-6">
                <div className="glassy ringed p-6 space-y-4">
                  <h2 className="text-2xl font-semibold">Корзина</h2>
                  {cart.length === 0 ? (
                    <p className="text-gray-400">Добавьте стикеры в корзину для покупки.</p>
                  ) : (
                    cart.map((item) => (
                      <div key={item.id} className="flex items-center justify-between border-b border-white/10 pb-4">
                        <div>
                          <p className="font-semibold">{item.title}</p>
                          <p className="text-xs text-gray-400">{item.artist}</p>
                        </div>
                        <div className="flex items-center gap-4">
                          <span>{formatTon(item.price)}</span>
                          <button className="text-xs text-gray-400" onClick={() => removeFromCart(item.id)}>
                            Удалить
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
                <div className="glassy ringed p-6 space-y-4 h-fit">
                  <h3 className="text-xl font-semibold">Оплата TON</h3>
                  <p className="text-gray-400 text-sm">Подключите кошелек и подтвердите транзакцию.</p>
                  <div className="flex items-center justify-between">
                    <span>Итого</span>
                    <span className="text-lg font-semibold">{formatTon(total)}</span>
                  </div>
                  <button
                    className="ton-button w-full py-3 rounded-xl font-medium"
                    onClick={checkout}
                    disabled={cart.length === 0}
                  >
                    Оплатить
                  </button>
                </div>
              </section>
            )}

            {activeTab === "profile" && (
              <section className="fade-up grid lg:grid-cols-[1fr_2fr] gap-6">
                <div className="glassy ringed p-6 space-y-4">
                  <h2 className="text-2xl font-semibold">Профиль</h2>
                  <div className="space-y-2 text-gray-300">
                    <p>Псевдоним: @glasscollector</p>
                    <p>Кошелек: {wallet ? "Подключен" : "Не подключен"}</p>
                    <p>NFT куплено: {owned.length}</p>
                  </div>
                  <div className="glassy ringed p-4 text-sm text-gray-300">
                    <p className="font-semibold">Уровень: Obsidian</p>
                    <p className="text-xs text-gray-400">Скидка на листинг: 5%</p>
                  </div>
                </div>
                <div className="glassy ringed p-6">
                  <h3 className="text-xl font-semibold mb-4">Моя коллекция</h3>
                  <div className="grid sm:grid-cols-2 gap-4">
                    {owned.map((item) => (
                      <div key={item.id} className="chip rounded-2xl p-4">
                        <p className="font-semibold">{item.title}</p>
                        <p className="text-xs text-gray-400">{item.artist}</p>
                        <p className="text-sm mt-2">{item.rarity}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

            {activeTab === "list" && (
              <section className="fade-up max-w-2xl">
                <div className="glassy ringed p-6 space-y-5">
                  <h2 className="text-2xl font-semibold">Разместить стикер</h2>
                  <form className="space-y-4" onSubmit={listSticker}>
                    <input name="title" placeholder="Название" required className="w-full px-4 py-3 rounded-2xl" />
                    <input name="artist" placeholder="Автор" required className="w-full px-4 py-3 rounded-2xl" />
                    <input name="image" placeholder="Ссылка на превью" required className="w-full px-4 py-3 rounded-2xl" />
                    <div className="grid sm:grid-cols-2 gap-3">
                      <input
                        name="price"
                        type="number"
                        step="0.01"
                        min="0"
                        placeholder="Цена в TON"
                        required
                        className="w-full px-4 py-3 rounded-2xl"
                      />
                      <input name="supply" placeholder="Тираж (например 1/100)" required className="w-full px-4 py-3 rounded-2xl" />
                    </div>
                    <div className="grid sm:grid-cols-2 gap-3">
                      <select name="rarity" required className="w-full px-4 py-3 rounded-2xl">
                        <option value="Common">Common</option>
                        <option value="Rare">Rare</option>
                        <option value="Ultra">Ultra</option>
                        <option value="Legendary">Legendary</option>
                      </select>
                      <select name="mood" required className="w-full px-4 py-3 rounded-2xl">
                        <option value="Dark">Dark</option>
                        <option value="Minimal">Minimal</option>
                        <option value="Pulse">Pulse</option>
                        <option value="Soft">Soft</option>
                      </select>
                    </div>
                    <textarea
                      name="description"
                      placeholder="Описание"
                      rows="4"
                      className="w-full px-4 py-3 rounded-2xl"
                    ></textarea>
                    <button className="ton-button w-full py-3 rounded-2xl font-medium">Опубликовать</button>
                  </form>
                </div>
              </section>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
